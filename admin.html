<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7eef3">
  <meta name="robots" content="noindex, nofollow">
  <title>号主后台 · DemoTu.com</title>
  <link rel="icon" href="assets/img/avatar.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/admin.css?v=202611251120">
  <script src="assets/js/redirect-github.js?v=202611251120"></script>
  <script>
  (function () {
    try {
      if (location.protocol.indexOf('http') !== 0) return;
      var u = new URL(location.href);
      if (!u.searchParams.has('v')) {
        u.searchParams.set('v', String(Date.now()));
        location.replace(u.pathname + u.search + u.hash);
      }
    } catch (e) {}
  })();
  </script>
  <script>window.SITE_CONFIG = {"socials":[{"name":"github","label":"GitHub","url":"https://github.com/DemoTu","icon":"github"},{"name":"gitee","label":"Gitee","url":"https://gitee.com/DemoTu","icon":"gitee"},{"name":"email","label":"邮箱","url":"mailto:hello@demotu.com","icon":"email"},{"name":"qq","label":"QQ","url":"#","icon":"qq"},{"name":"wechat","label":"微信","url":"#","icon":"wechat"},{"name":"rss","label":"RSS","url":"#","icon":"rss"}]};</script>
  <script src="assets/js/workbuddy-cloud-sdk.js?v=202611251215"></script>
  <script src="assets/js/cloud-config.js?v=202611251120"></script>
  <script src="assets/js/cloud.js?v=202611251120"></script>
  <script src="assets/js/profile.js?v=202611251120"></script>
  <script src="assets/js/site-data.js?v=202611251120"></script>
</head>
<body>
  <div class="admin-glow one"></div><div class="admin-glow two"></div>

  <!-- 邮箱验证码登录 -->
  <section class="login-wrap" id="loginView">
    <div class="login-card">
      <div class="admin-badge">✦ OWNER ONLY</div>
      <h1>DemoTu<span>.</span>com</h1>
      <p class="login-sub">号主后台 · 邮箱验证码登录</p>
      <div class="cloud-form">
        <label>邮箱地址<input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"></label>
        <div class="pass-row">
          <input type="text" id="loginCode" placeholder="验证码" inputmode="numeric" maxlength="8">
          <button type="button" class="btn btn-soft" id="sendCodeBtn">获取验证码</button>
        </div>
        <button type="button" class="btn btn-primary wide" id="loginBtn">登录</button>
        <p class="login-error" id="loginError"></p>
      </div>
      <p class="login-hint">只有号主可以登录发布；访客无需登录，只能看到你发布的内容。</p>
      <a class="back-link" href="index.html">← 返回主页</a>
    </div>
  </section>

  <!-- 首次绑定号主 -->
  <section class="login-wrap" id="bindView" hidden>
    <div class="login-card">
      <div class="admin-badge">✦ FIRST TIME</div>
      <h1>绑定<span>号主</span></h1>
      <p class="login-sub">当前账号： <b id="whoEmail">已登录</b></p>
      <p class="login-hint">首次使用请把这个账号绑定为本站号主。绑定后只有这个账号能发布和修改内容。</p>
      <button type="button" class="btn btn-primary wide" id="bindBtn">绑定为号主</button>
      <button type="button" class="btn btn-ghost wide" id="bindLogoutBtn">退出登录</button>
      <p class="login-error" id="bindError"></p>
    </div>
  </section>

  <!-- 后台主体 -->
  <div class="admin-shell" id="dashView" hidden>
    <header class="admin-top">
      <div class="admin-brand"><span class="admin-mark">✿</span><b>DemoTu.com</b><small>号主后台</small></div>
      <div class="admin-top-actions">
        <a class="btn btn-ghost" href="index.html" target="_blank">预览主页 ↗</a>
        <button class="btn btn-ghost" id="logoutBtn">退出登录</button>
      </div>
    </header>
    <div class="admin-layout">
      <nav class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-tab="profile"><span>◉</span>资料链接</button>
        <button class="admin-tab" data-tab="social"><span>❖</span>社区</button>
        <button class="admin-tab" data-tab="photo"><span>▦</span>照片墙</button>
        <button class="admin-tab" data-tab="blog"><span>✎</span>博客</button>
        <button class="admin-tab" data-tab="music"><span>♪</span>音乐</button>
        <button class="admin-tab" data-tab="moment"><span>✦</span>说说</button>
      </nav>
      <main class="admin-main">
        <div class="card notice" id="cloudNotice">正在连接云端发布服务…</div>
        <section class="admin-panel" id="panel-profile" hidden></section>
        <section class="admin-panel" id="panel-social" hidden></section>
        <section class="admin-panel" id="panel-photo" hidden></section>
        <section class="admin-panel" id="panel-blog" hidden></section>
        <section class="admin-panel" id="panel-music" hidden></section>
        <section class="admin-panel" id="panel-moment" hidden></section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="assets/js/admin-cloud.js?v=202611251120"></script>
</body>
</html>
