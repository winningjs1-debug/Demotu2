    <path d="M150 262c-24 0-44-16-56-40-4-8-4-16 2-20 6-4 12 0 16 8 8 18 22 28 38 30z"/>
    <path d="M150 262c24 0 44-16 56-40 4-8 4-16-2-20-6-4-12 0-16 8-8 18-22 28-38 30z"/>
