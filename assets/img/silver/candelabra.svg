    <circle cx="207" cy="134" r="9" fill="url(#pearl)"/>
    <circle cx="150" cy="196" r="7" fill="url(#pearl)"/>
    <circle cx="128" cy="212" r="5" fill="url(#pearl)"/>
    <circle cx="172" cy="212" r="5" fill="url(#pearl)"/>
    <circle cx="110" cy="228" r="4" fill="url(#pearl)"/>
    <circle cx="190" cy="228" r="4" fill="url(#pearl)"/>
  </g>
  <!-- 珍珠链 -->
  <g fill="none" stroke="#cfd5dd" stroke-width=".7" stroke-dasharray="1 4.6" opacity=".9">
    <path d="M70 150c-8 26 6 44 24 52"/>
    <path d="M230 150c8 26-6 44-24 52"/>
