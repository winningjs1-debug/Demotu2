    <path d="M78 186h30c3 0 5 3 5 6l-5 12h-30l-5-12c0-3 2-6 5-6z"/>
    <path d="M192 186h30c3 0 5 3 5 6l-5 12h-30l-5-12c0-3 2-6 5-6z"/>
    <!-- 蜡烛 -->
    <path d="M87 148h12v38H87z"/>
    <path d="M201 148h12v38h-12z"/>
