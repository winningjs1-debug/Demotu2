<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>社区 · DemoTu.com</title>
<script>
(function () {
  try {
    if (location.protocol.indexOf('http') !== 0) return;
    var u = new URL(location.href);
    if (!u.searchParams.has('v')) {
      u.searchParams.set('v', String(Date.now()));
      location.replace(u.pathname + u.search + u.hash);
    }
  } catch (e) {}
})();
</script>
<link rel="icon" href="assets/img/avatar.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css?v=202611241900">
<link rel="stylesheet" href="assets/css/social.css?v=202611241900">
<script>
  window.SITE_CONFIG = {"site":{"name":"DemoTu.com","title":"DemoTu.com","subtitle":"记录生活 · 分享热爱"}};
</script>
<script src="assets/js/skin.js?v=202611241900"></script>
</head>
<body class="social-page">

<!-- 悬浮皮肤切换器（三端通用） -->
<button class="skin-fab" id="skinFab" aria-label="切换装修风格" title="切换装修风格">❀</button>
<div class="skin-picker" id="skinPicker">
  <div class="skin-picker-head">选择装修风格</div>
  <button data-skin-btn="A"><span class="sw a"></span><b>原版·餐具兔</b><small>法式蕾丝·居中铺满</small></button>
  <button data-skin-btn="B"><span class="sw b"></span><b>小羊·居中</b><small>原色拼贴·居中排版</small></button>
  <button data-skin-btn="C"><span class="sw c"></span><b>兔宝·居中</b><small>原色拼贴·居中排版</small></button>
  <button data-skin-btn="D"><span class="sw d"></span><b>双拼·居中</b><small>羊兔并置·居中排版</small></button>
  <button data-skin-btn="E"><span class="sw e"></span><b>小羊·纸底</b><small>原色拼贴·居中纸底</small></button>
</div>

<header class="soc-header">
  <div class="soc-header-inner">
    <a class="soc-logo" href="index.html"><span class="soc-logo-word">DemoTu</span><small class="soc-logo-sub">ROSE &amp; BUNNY DIARY</small></a>
    <nav class="soc-nav">
      <a href="index.html">首页</a>
      <a class="active" href="social.html">社区</a>
      <a href="photowall.html">相册</a>
      <a href="about.html">关于</a>
    </nav>
  </div>
</header>

<main class="soc-main">
  <!-- 个人资料卡 -->
  <section class="soc-profile glass-card">
    <div class="soc-cover" id="socCover"></div>
    <div class="soc-profile-body">
      <div class="soc-avatar-wrap">
        <div class="soc-avatar" id="avatarBox">
          <img id="avatarImg" src="assets/img/avatar.svg" alt="头像" data-profile="avatar">
          <button class="avatar-edit" id="avatarEdit" title="编辑资料与头像">✎</button>
        </div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      </div>
      <div class="soc-profile-info">
        <div class="soc-name-row">
          <h1 id="profName" data-profile="name">DemoTu.com</h1>
          <span class="soc-verified">✓</span>
        </div>
        <p class="soc-handle"><span id="profHandle" data-profile="handle">@demotu</span> · 记录生活 · 分享热爱</p>
        <p class="soc-bio" id="profBio" data-profile="bio">把每一天的小确幸，写成手账里的一页。</p>
        <div class="soc-stats">
          <div><strong id="statPosts">0</strong><span>帖子</span></div>
          <div><strong id="statLikes">5.2w</strong><span>获赞</span></div>
          <div><strong id="statFollow">5.2w</strong><span>粉丝</span></div>
        </div>
      </div>
      <button class="soc-edit-btn" id="editProfileBtn">编辑资料</button>
    </div>
  </section>

  <!-- 发帖框 -->
  <section class="soc-compose glass-card">
    <div class="compose-top">
      <img class="compose-avatar" id="composeAvatar" src="assets/img/avatar.svg" alt="" data-profile="avatar">
      <textarea id="composeText" placeholder="分享此刻的心情…" rows="1" maxlength="500"></textarea>
    </div>
    <div class="compose-actions">
      <label class="compose-tool" title="添加图片">🖼 <input type="file" id="composeImage" accept="image/*" hidden></label>
      <span class="compose-hint" id="composeHint"></span>
      <button class="compose-submit" id="composeSubmit" disabled>发布</button>
    </div>
    <div class="compose-preview" id="composePreview"></div>
  </section>

  <!-- 动态列表 -->
  <div class="soc-feed-head"><span>最新动态</span><small id="feedCount">共 0 条</small></div>
  <section class="soc-feed" id="feed"></section>
  <div class="soc-empty" id="feedEmpty" hidden>还没有动态，发布第一条吧 ❀</div>
</main>

<!-- 编辑资料弹窗（头像 / 昵称 / 账号 / 简介一步完成） -->
<div class="modal" id="editModal" hidden>
  <div class="modal-card edit-card">
    <h3>编辑个人资料</h3>
    <div class="edit-avatar-row">
      <div class="edit-avatar"><img id="editAvatarPreview" src="assets/img/avatar.svg" alt="头像预览"></div>
      <div class="edit-avatar-tools">
        <button class="btn-soft" id="editAvatarPick">更换头像</button>
        <button class="btn-text" id="editAvatarReset">恢复默认</button>
        <small>支持 JPG / PNG，可缩放拖动裁剪</small>
      </div>
      <input type="file" id="editAvatarInput" accept="image/*" hidden>
    </div>
    <label>昵称<input type="text" id="editName" maxlength="24" placeholder="DemoTu.com"><small class="field-count" id="nameCount">0 / 24</small></label>
    <label>账号<span class="handle-field"><i>@</i><input type="text" id="editHandle" maxlength="20" placeholder="demotu"></span></label>
    <label>简介<textarea id="editBio" rows="3" maxlength="100" placeholder="写一句属于你的签名…"></textarea><small class="field-count" id="bioCount">0 / 100</small></label>
    <div class="modal-actions">
      <button class="btn-ghost" id="editCancel">取消</button>
      <button class="btn-primary" id="editSave">保存并同步</button>
    </div>
  </div>
</div>

<!-- 头像裁剪弹窗 -->
<div class="modal" id="cropModal" hidden>
  <div class="modal-card crop-card">
    <h3>调整头像</h3>
    <div class="crop-stage" id="cropStage"><img id="cropImg" alt="待裁剪图片"></div>
    <label class="crop-zoom">缩放<input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1"></label>
    <p class="crop-tip">拖动图片调整位置，保存后自动同步到全站</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="cropCancel">取消</button>
      <button class="btn-primary" id="cropSave">使用这张</button>
    </div>
  </div>
</div>

<!-- 评论弹窗 -->
<div class="modal" id="commentModal" hidden>
  <div class="modal-card comment-card">
    <h3>评论</h3>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input-row">
      <input type="text" id="commentInput" placeholder="说点什么…" maxlength="120">
      <button class="btn-primary" id="commentSend">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/profile.js?v=202611241900"></script>
<script src="assets/js/site-data.js?v=202611241900"></script>
<script src="assets/js/social.js?v=202611241900"></script>
</body>
</html>
